[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "assay"
version = "0.1.0"
description = "ASSAY — turning LLM red-team measurement into measurement science: validated multi-judge instrumentation, literature-grounded adaptive attacks, and mechanistic refusal analysis across the frontier model matrix."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "ASSAY Research" }]
dependencies = [
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "numpy>=1.26",
    "httpx>=0.27",
]

[project.optional-dependencies]
analysis = [
    "scipy>=1.12",
    "scikit-learn>=1.4",
    "pandas>=2.2",
    "matplotlib>=3.8",
]
# Serving plane: pinned vLLM release line (verified 2026-11-07).
# Requires NVIDIA GPUs; CUDA images must match (see docs/RUNBOOK_AWS.md).
serving = [
    "vllm>=0.33.0,<0.34",
]
# Mechanistic layer (hidden-state hooks; transformers 5.x line, verified in the
# 2026-11-07 pass as the current major supporting Qwen3.x/GLM-5/DeepSeek-V4).
mech = [
    "torch>=2.4",
    "transformers>=5.0,<6",
    "accelerate>=0.33",
]
aws = [
    "boto3>=1.34",
]
dev = [
    "build>=1.2",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-PyYAML",
]

[project.scripts]
assay = "assay.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "integration: end-to-end tests with mock providers",
    "properties: property-based invariants over generated fixtures",
]

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_configs = true
