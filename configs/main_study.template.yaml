# ASSAY main study TEMPLATE — freeze before any research run:
#   1. run `assay behaviors fetch` (pins upstream revisions + licenses)
#   2. probe every model on its tier (`scripts/aws/probe_and_pin.py`)
#      and fill probe_sha256 + revision + served_id
#   3. PIN_EXACT_* placeholders are REFUSED at pilot/confirmatory stages
# Budget: hard cap fail-closed; see docs/BUDGET.md for the cost model.
experiment_name: assay_main_v1
stage: pilot   # pilot -> confirmatory after gates + review sign-off
seed: 20261107
targets:
  # --- API tier (verified pricing in the registry; probe pins served ids) ---
  - model_id: api/anthropic/claude-haiku-5-5
    revision: api
    determinism_class: unseeded_api
    grid: full
  - model_id: api/openai/gpt-6-luna
    revision: api
    determinism_class: unseeded_api
    grid: full
  - model_id: api/google/gemini-3.5-flash-lite
    revision: api
    determinism_class: unseeded_api
    grid: full
  - model_id: api/deepseek/deepseek-chat
    revision: api
    determinism_class: unseeded_api
    grid: full
  # --- expensive flagships: predeclared CORE grid (recorded treatment) ---
  - model_id: api/anthropic/claude-fable-5-1
    revision: api
    determinism_class: unseeded_api
    grid: core
  - model_id: api/openai/gpt-6.1-terra
    revision: api
    determinism_class: unseeded_api
    grid: core
  - model_id: api/google/gemini-4-argon
    revision: api
    determinism_class: unseeded_api
    grid: core
  - model_id: api/xai/grok-4.7
    revision: api
    determinism_class: unseeded_api
    grid: core
  # --- open weights on the A100 tier (probe + pin before use) ---
  - model_id: Qwen/Qwen3.5-35B-A3B
    tier: aws_a100_80gb
    revision: PIN_EXACT_REVISION_BEFORE_RUN
    probe_sha256: PIN_AT_PROBE
    determinism_class: seeded_server_best_effort
    grid: full
  - model_id: Qwen/Qwen3.8-27B
    tier: aws_a100_80gb
    revision: PIN_EXACT_REVISION_BEFORE_RUN
    probe_sha256: PIN_AT_PROBE
    determinism_class: seeded_server_best_effort
    grid: full
  - model_id: zai-org/GLM-4.7-Flash
    tier: aws_a100_80gb
    revision: PIN_EXACT_REVISION_BEFORE_RUN
    probe_sha256: PIN_AT_PROBE
    determinism_class: seeded_server_best_effort
    grid: full
  - model_id: deepseek-ai/DeepSeek-V4-Flash
    tier: aws_a100_80gb
    revision: PIN_EXACT_REVISION_BEFORE_RUN
    probe_sha256: PIN_AT_PROBE
    determinism_class: seeded_server_best_effort
    grid: full
  - model_id: meta-llama/Llama-4-Scout-17B-16E-Instruct
    tier: aws_a100_80gb
    revision: PIN_EXACT_REVISION_BEFORE_RUN
    probe_sha256: PIN_AT_PROBE
    determinism_class: seeded_server_best_effort
    grid: full
  - model_id: google/gemma-4-12B-it
    tier: aws_a100_80gb
    revision: PIN_EXACT_REVISION_BEFORE_RUN
    probe_sha256: PIN_AT_PROBE
    determinism_class: seeded_server_best_effort
    grid: full
  - model_id: mistralai/Mistral-Small-3.1-24B-Instruct-2503
    tier: aws_a100_80gb
    revision: PIN_EXACT_REVISION_BEFORE_RUN
    probe_sha256: PIN_AT_PROBE
    determinism_class: seeded_server_best_effort
    grid: full
attacks:
  - attack_id: prefix_affirm
  - attack_id: refusal_suppress
  - attack_id: deepinception
  - attack_id: pap
  - attack_id: cipher_complex
  - attack_id: cipher_unicode
  - attack_id: multilingual      # pairs only with multi_jail behaviors (plan-enforced)
  - attack_id: many_shot         # long-context: planner caps shots by budget class
  - attack_id: no_think          # reasoning targets only (plan-enforced)
  - attack_id: prefill_answer    # reasoning targets only
  - attack_id: random_augment    # triviality baseline
  - attack_id: pair              # adaptive multi-turn (needs attackers below)
  - attack_id: tap
  - attack_id: crescendo
attackers:                        # cross-lab by design (anti self-preference)
  - model_id: api/anthropic/claude-haiku-5-5
  - model_id: api/openai/gpt-6-luna
  - model_id: api/google/gemini-3.5-flash-lite
behaviors:
  harmful_sets: [harmbench_standard, jbb_behaviors]
  benign_sets: [xstest]
  max_behaviors_per_set: 100
  per_category_cap: 10
  split_seed: 20261107
judges:
  judges: [sreject_rubric, semantic_recon, refusal_semantic,
           llama_guard_4, shieldgemma, wildguard, harmbench_cls]
  panel_models: [api/anthropic/claude-haiku-5-5, api/openai/gpt-6-luna,
                 api/google/gemini-3.5-flash-lite, Qwen/Qwen3.5-35B-A3B]
  operating_fpr: 0.05
  calibration_split: validation
  human_label_sample: 400
  human_labelers: 3
mechanistic:
  models: [Qwen/Qwen3.5-35B-A3B, Qwen/Qwen3.8-27B, zai-org/GLM-4.7-Flash,
           google/gemma-4-12B-it, mistralai/Mistral-Small-3.1-24B-Instruct-2503]
  layers: all
  direction_method: diff_in_means
  prompts_per_class: 64
analysis:
  cluster_key: behavior_cluster
  bootstrap_replicates: 2000
  bootstrap_seed: 20261107
  confidence_level: 0.95
  sesoi: 0.10
  multiplicity: holm
budget:
  hard_cap_usd: 4000.0
  warn_at_fraction: 0.8
  api_call_cap_per_run: 25000
provenance:
  code_revision: PIN_EXACT_COMMIT_BEFORE_RUN
  experiment_name: assay_main_v1
  stage: pilot
