name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev]' -q
      - run: python -m ruff check src tests scripts
      - run: python -m ruff format --check src || true

  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev]' -q
      - run: python -m mypy src/assay

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev,analysis]' -q
      - run: python -m pytest -q --tb=short
      - run: coverage report || true

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev,analysis]' -q
      - name: doctor
        run: assay doctor
      - name: end-to-end mock smoke run (plan -> run -> judge -> verify)
        run: |
          set -e
          assay run --config configs/smoke.yaml --run-dir runs/smoke --battery-cache data/cache
      - name: verify the smoke run
        run: assay verify --run-dir runs/smoke
